# Netlify: publica só os arquivos do app (sem README, render.yaml e serve.ps1).
[build]
  command = "rm -rf dist && mkdir -p dist && cp -R index.html manifest.webmanifest sw.js css js icons img dist/"
  publish = "dist"

# O service worker e a página principal sempre buscam a versão nova.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), geolocation=(self), microphone=()"
